[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveykit"
version = "0.1.0"
description = "Tools for an agent-driven literature-survey pipeline: index, gate, gap, fetch, synthesise, draft, verify, produce, revise."
requires-python = ">=3.11"
dependencies = []          # core is stdlib-only (tomllib, zipfile, xml)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
survey = "surveykit.cli:main"

[tool.setuptools.packages.find]
include = ["surveykit*"]

[tool.setuptools.package-data]
surveykit = ["../templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
